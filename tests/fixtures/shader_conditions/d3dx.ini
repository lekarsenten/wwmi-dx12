[Logging]
calls = 0
debug = 0
show_warnings = 0

[System]
skip_early_includes_load = 0
config_initialization_delay = -1

[Constants]
global $mod_enabled = 1
global $object_detected = 0
global $state_id = 0
global $ps = 0

[TextureOverrideRoverShapeKeyCallback]
hash = f02baf77
run = CommandListUpdateMergedSkeleton

[CommandListUpdateMergedSkeleton]
if $mod_enabled == 1 && cs == 3381.4444
    $state_id = 1
endif

[CommandListRoverNested]
if $object_detected
    if ps == 1024
        $state_id = 2
    elif 3381.4444 == cs
        $state_id = 3
    endif
endif

[CommandListRoverPost]
if cs!=3381.4444
    post $state_id = 4
endif

[CommandListRoverTextureFilter]
if ps-t0 == 1
    $state_id = 5
endif

[CommandListRoverEnabled]
if $mod_enabled && $ps == 0
    $state_id = 6
endif
